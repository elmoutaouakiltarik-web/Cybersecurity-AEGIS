openapi: 3.1.0
info:
  title: Cybersecurity-AEGIS Orchestrator API
  version: 0.1.0
  description: Local defensive Cybersecurity-AEGIS MVP API.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service health
  /api/v1/metrics:
    get:
      summary: Current aggregate metrics
      responses:
        "200":
          description: Metrics response
  /api/v1/modules:
    get:
      summary: List module statuses
      responses:
        "200":
          description: Module status list
    put:
      summary: Upsert a module status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModuleStatus"
      responses:
        "204":
          description: Updated
  /api/v1/events:
    get:
      summary: List recent events
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 1000
      responses:
        "200":
          description: Event list
    post:
      summary: Ingest normalized event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecurityEvent"
      responses:
        "201":
          description: Created
  /api/v1/ingest/{source}:
    post:
      summary: Ingest source-specific event
      parameters:
        - name: source
          in: path
          required: true
          schema:
            type: string
            enum: [wazuh, suricata, crowdsec, ot, generic]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Created
  /api/v1/ot/assets:
    get:
      summary: List OT assets known to the orchestrator
      responses:
        "200":
          description: Asset list
components:
  schemas:
    SecurityEvent:
      type: object
      required: [source, category, severity, title]
      properties:
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        source:
          type: string
        category:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, low, info]
        title:
          type: string
        description:
          type: string
        resolved:
          type: boolean
        tags:
          type: array
          items:
            type: string
        raw_data:
          type: object
    ModuleStatus:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [running, stopped, error, degraded, unknown]
        version:
          type: string
        error:
          type: string
