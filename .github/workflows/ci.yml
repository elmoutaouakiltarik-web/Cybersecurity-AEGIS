name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go orchestrator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/orchestrator/go.mod
          cache-dependency-path: core/orchestrator/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  python:
    name: Python modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff
          pip install -r modules/ml/cybershield_ai/requirements.txt
      - name: Lint (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 --target-version py311 .
      - name: Tests
        run: pytest modules/industrial/site_assessment/tests modules/network modules/ml/cybershield_ai/tests -q

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
