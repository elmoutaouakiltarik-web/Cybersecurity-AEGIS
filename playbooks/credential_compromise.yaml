---
# Cybersecurity-AEGIS SOAR Playbook: Credential Compromise Response
# PB-CRED-001
id: PB-CRED-001
name: Credential Compromise Response
description: |
  Response to credential theft, brute force success, or credential dump events.
  Covers: LSASS dump, Kerberoasting, password spray, MFA bypass.
  Maps to MITRE ATT&CK TA0006 Credential Access.
version: "1.0"
dry_run: true
ot_safe: true
enabled: true

severity_filter:
  - high
  - critical

category_filter:
  - identity
  - endpoint

trigger_conditions:
  - title_contains:
      - lsass
      - credential dump
      - kerberoast
      - password spray
      - brute force success
      - mfa bypass

actions:
  - type: log
    description: "Audit log: Credential compromise"
    params:
      message: "Credential compromise indicator — account lockout review required"

  - type: tag_event
    description: "Tag credential compromise"
    params:
      tags:
        - credential_compromise
        - T1003
        - account_review_required

  - type: enrich
    description: "IP enrichment"
    params:
      check_threat_intel: true
      check_geo: true

  - type: send_alert
    description: "Notify identity team and SOC"
    params:
      channel: soc_email
      priority: high
      subject: "AEGIS: Credential Compromise Indicator — {{source_ip}}"
      body: |
        Credential compromise or theft indicator detected.
        Source IP: {{source_ip}}
        Event: {{title}}

        Immediate actions required:
        1. Verify if credential dump actually succeeded
        2. Reset affected user passwords
        3. Enable/verify MFA on affected accounts
        4. Review authentication logs for the last 24h
        5. Check for Golden Ticket / Pass-the-Hash patterns

  - type: update_status
    description: "Mark event for active investigation"
    params:
      status: investigating
      priority: high

  - type: create_ticket
    description: "Create identity incident ticket"
    params:
      severity: high
      team: identity_security
      title: "Credential Compromise: {{source_ip}} — {{title}}"
      tags:
        - credential_theft
        - identity_incident
      investigation_steps:
        - "Identify affected user accounts from LSASS/dump artifacts"
        - "Force password reset on all identified accounts"
        - "Review Azure AD / Active Directory sign-in logs"
        - "Enable high-risk user policies in Entra ID Conditional Access"
        - "Check for persistence via account manipulation (T1098)"
